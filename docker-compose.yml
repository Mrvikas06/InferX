version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inferx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-inferx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inferx} -d ${POSTGRES_DB:-inferx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inferx-net

  redis:
    image: redis:7-alpine
    container_name: inferx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inferx-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inferx-backend
    restart: unless-stopped
    environment:
      APP_NAME: InferX
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inferx}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-inferx}
      REDIS_URL: redis://redis:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - models_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inferx-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inferx-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - inferx-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  models_cache:
    driver: local

networks:
  inferx-net:
    driver: bridge
