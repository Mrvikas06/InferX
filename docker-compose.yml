version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inferx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-inferx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inferx} -d ${POSTGRES_DB:-inferx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inferx-net

  redis:
    image: redis:7-alpine
    container_name: inferx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - inferx-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  inferx-net:
    driver: bridge
