apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inferx-backend-hpa
  namespace: inferx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inferx-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inferx-frontend-hpa
  namespace: inferx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inferx-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
