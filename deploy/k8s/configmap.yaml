apiVersion: v1
kind: ConfigMap
metadata:
  name: inferx-config
  namespace: inferx
  labels:
    app.kubernetes.io/name: inferx
data:
  APP_NAME: "InferX"
  APP_ENV: "production"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  BACKEND_INTERNAL_URL: "http://inferx-backend.inferx.svc.cluster.local:8000"
  DATABASE_HOST: "inferx-postgres.inferx.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "inferx"
  DATABASE_USER: "inferx"
  REDIS_HOST: "inferx-redis.inferx.svc.cluster.local"
  REDIS_PORT: "6379"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
