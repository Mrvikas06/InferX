apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inferx.fullname" . }}-secrets
  labels:
    {{- include "inferx.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
  REDIS_PASSWORD: {{ .Values.redis.auth.password | quote }}
  JWT_SECRET_KEY: {{ .Values.security.jwtSecretKey | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "inferx.fullname" .) .Values.postgresql.auth.database | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-redis-master:6379/0" .Values.redis.auth.password (include "inferx.fullname" .) | quote }}
