version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inferx-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inferx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-inferx}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inferx} -d ${POSTGRES_DB:-inferx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - inferx-prod-net

  redis:
    image: redis:7-alpine
    container_name: inferx-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme_redis}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - inferx-prod-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: inferx/backend:latest
    container_name: inferx-prod-backend
    restart: always
    environment:
      APP_NAME: InferX
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-inferx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inferx}
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis}@redis:6379/0
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret must be provided}
    ports:
      - "8000:8000"
    volumes:
      - models_prod_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - inferx-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: inferx/frontend:latest
    container_name: inferx-prod-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - inferx-prod-net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  models_prod_cache:
    driver: local

networks:
  inferx-prod-net:
    driver: bridge
